<!doctype html>
<!-- Claudio González - Gabriel Garcia - Moisés Pacheco -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente del Hotel</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d2433; --mute:#6b7280; --line:#e4e2dc;
          --prolog:#7c3aed; --llm:#0f766e; --user:#1d2433; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161b; --card:#1d2027; --ink:#e8e8ea; --mute:#9aa0aa; --line:#2c303a; --user:#3b4252; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
  header { padding:18px 16px 6px; max-width:1000px; margin:auto; }
  h1 { margin:0; font-size:1.35rem; }
  p.sub { margin:2px 0 0; color:var(--mute); font-size:.9rem; }
  main { max-width:1000px; margin:auto; padding:10px 16px 24px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
  .bar select, .bar button { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line);
         background:var(--card); color:var(--ink); cursor:pointer; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .chips button { font-size:.8rem; padding:4px 10px; border-radius:999px; border:1px solid var(--line);
         background:var(--card); color:var(--mute); cursor:pointer; }
  .chips button:hover { color:var(--ink); }
  .cols { display:grid; gap:12px; grid-template-columns:1fr 1fr; }
  .cols.uno { grid-template-columns:1fr; }
  @media (max-width:700px) { .cols { grid-template-columns:1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .panel h2 { margin:0; padding:8px 12px; font-size:.85rem; letter-spacing:.04em; text-transform:uppercase; color:#fff; }
  .panel.prolog h2 { background:var(--prolog); } .panel.llm h2 { background:var(--llm); }
  .log { height:46vh; min-height:260px; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:92%; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; font-size:.92rem; }
  .msg.u { align-self:flex-end; background:var(--user); color:#fff; }
  .msg.b { align-self:flex-start; background:var(--bg); border:1px solid var(--line); }
  .msg.b.mono { font-family:ui-monospace,Menlo,monospace; font-size:.82rem; }
  form { display:flex; gap:8px; margin-top:12px; }
  input[type=text] { flex:1; font:inherit; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
         background:var(--card); color:var(--ink); }
  form button { font:inherit; padding:0 20px; border:0; border-radius:10px; background:var(--ink); color:var(--bg); cursor:pointer; }
  .pensando { color:var(--mute); font-style:italic; }
</style>
</head>
<body>
<header>
  <h1>Asistente del Hotel</h1>
  <p class="sub">Mismo conocimiento, dos cerebros: lógica de primer orden (Prolog) y un LLM.</p>
</header>
<main>
  <div class="bar">
    <label for="modo">Modo:</label>
    <select id="modo">
      <option value="ambos">Comparar ambos</option>
      <option value="prolog">Solo Prolog</option>
      <option value="llm">Solo LLM</option>
    </select>
    <button id="reiniciar" type="button">Reiniciar conocimiento</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="cols" id="cols">
    <section class="panel prolog" id="p-prolog"><h2>Prolog (lógica de primer orden)</h2><div class="log" id="log-prolog"></div></section>
    <section class="panel llm" id="p-llm"><h2>LLM (Python)</h2><div class="log" id="log-llm"></div></section>
  </div>
  <form id="form" autocomplete="off">
    <input type="text" id="q" placeholder="Escribe tu pregunta… (ej: ¿Qué habitaciones tienen spa?)" autofocus>
    <button>Enviar</button>
  </form>
</main>
<script>
const ejemplos = ["¿Qué habitaciones están disponibles?","Necesito una habitación para 3 personas",
  "¿Qué servicios incluye la suite?","¿Hay habitaciones contiguas libres?","¿Cuánto cuesta una doble por 3 noches?",
  "Explica por qué la 302 sirve para 2 personas","ocupar 102","liberar 102"];
const $ = id => document.getElementById(id);
const modo = $("modo");

ejemplos.forEach(t => { const b = document.createElement("button"); b.type="button"; b.textContent=t;
  b.onclick = () => { $("q").value = t; $("form").requestSubmit(); }; $("chips").appendChild(b); });

function aplicarModo() {
  $("p-prolog").style.display = modo.value === "llm" ? "none" : "";
  $("p-llm").style.display = modo.value === "prolog" ? "none" : "";
  $("cols").classList.toggle("uno", modo.value !== "ambos");
}
modo.onchange = aplicarModo; aplicarModo();

function add(logId, texto, cls) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = texto;
  const log = $(logId); log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}

$("form").onsubmit = async e => {
  e.preventDefault();
  const pregunta = $("q").value.trim(); if (!pregunta) return;
  $("q").value = "";
  const m = modo.value;
  if (m !== "llm") add("log-prolog", pregunta, "u");
  if (m !== "prolog") add("log-llm", pregunta, "u");
  const pP = m !== "llm" ? add("log-prolog", "…", "b mono pensando") : null;
  const pL = m !== "prolog" ? add("log-llm", "pensando…", "b pensando") : null;
  try {
    const r = await fetch("/api/preguntar", {method:"POST", headers:{"Content-Type":"application/json"},
                          body: JSON.stringify({pregunta, modo: m})});
    const j = await r.json();
    if (pP) { pP.className = "msg b mono"; pP.textContent = j.prolog ?? j.error ?? ""; }
    if (pL) {
      if (j.comando) { pL.remove(); add("log-llm", "(Cambio de estado aplicado en el conocimiento compartido)", "b"); }
      else { pL.className = "msg b"; pL.textContent = j.llm ?? j.error ?? ""; }
    }
  } catch (err) {
    if (pP) pP.textContent = "Error de conexión"; if (pL) pL.textContent = "Error de conexión";
  }
};

$("reiniciar").onclick = async () => {
  await fetch("/api/reiniciar", {method:"POST"});
  $("log-prolog").innerHTML = ""; $("log-llm").innerHTML = "";
  add("log-prolog", "Conocimiento reiniciado al estado inicial.", "b"); add("log-llm", "Conocimiento reiniciado al estado inicial.", "b");
};
</script>
</body>
</html>
